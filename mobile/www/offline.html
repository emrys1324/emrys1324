<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Isla — offline</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #fbf7f0; color: #2e1e14;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; justify-content: center; text-align: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      main { max-width: 340px; }
      .logo { width: 88px; height: 88px; }
      h1 { font-family: Georgia, "Iowan Old Style", serif; font-size: 28px; margin: 20px 0 8px; }
      p { color: #5a3a25; font-size: 17px; line-height: 1.5; margin: 0 0 28px; }
      button {
        appearance: none; border: 0; border-radius: 16px; min-height: 52px; width: 100%;
        background: #5a3a25; color: #fbf7f0; font-size: 17px; font-weight: 700;
      }
      button:active { transform: scale(.98); }
      small { display: block; margin-top: 16px; color: #714a2f; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#5a3a25"/><path d="M18 27h24v9a12 12 0 0 1-12 12h0a12 12 0 0 1-12-12z" fill="#fbf7f0"/><path d="M42 30h3a5 5 0 0 1 0 10h-4" fill="none" stroke="#fbf7f0" stroke-width="3"/><path d="M24 22c0-3 3-3 3-6M31 22c0-3 3-3 3-6" stroke="#c9d6c1" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
      <h1>You're offline</h1>
      <p>Isla needs an internet connection to show the menu and place orders. Check your mobile data or Wi-Fi and try again.</p>
      <button id="retry" type="button">Try again</button>
      <small id="status" aria-live="polite"></small>
    </main>
    <script>
      var HOME = "https://pahuway-cafe.vercel.app/";
      function retry() {
        var s = document.getElementById("status");
        s.textContent = "Connecting…";
        fetch(HOME, { method: "HEAD", cache: "no-store", mode: "no-cors" })
          .then(function () { window.location.replace(HOME); })
          .catch(function () { s.textContent = "Still offline. We'll keep trying."; });
      }
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
      setInterval(function () { if (navigator.onLine) retry(); }, 15000);
    </script>
  </body>
</html>
