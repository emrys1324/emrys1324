# Fast checks for every pull request: types + production build.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# "shell: bash" makes every step run with -eo pipefail, so a failing command
# piped into `tail` still fails the job.
defaults:
  run:
    shell: bash

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
