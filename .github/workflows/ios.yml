# Builds the Isla iPhone app on GitHub's Mac machines (no Mac needed).
#  • "check" job: compiles for the iOS Simulator without signing. Needs no Apple account.
#  • "release" job: signs with your Apple Developer account and uploads to TestFlight /
#    App Store Connect. Runs only when the APPLE_* secrets exist and you choose upload.
name: iOS app

on:
  # Compile check on pull requests that touch the iPhone project (uses macOS minutes)
  pull_request:
    paths: ["ios/**", "capacitor.config.ts", "package.json", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the App Store (e.g. 1.0.0)"
        default: "1.0.0"
        required: true
      upload:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: false

permissions:
  contents: read

# "shell: bash" makes every step run with -eo pipefail, so a failing command
# piped into `tail` still fails the job.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npx cap sync ios
      - name: Compile for iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          echo "iOS app compiled successfully."

  release:
    if: github.event.inputs.upload == 'true'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Check Apple secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v — see docs/MOBILE.md"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - run: npm ci
      - run: npx cap sync ios
      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Archive (automatic signing via API key)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Isla.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ github.event.inputs.version_name }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -40
      - name: Upload to App Store Connect (TestFlight)
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ios/App/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Isla.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "Uploaded. The build appears in App Store Connect → TestFlight after processing (10–30 min)."
